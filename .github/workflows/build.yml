name: Build PRO TTS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q ./*.zip
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install SDK packages
        run: |
          SDKM=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Using: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: PRO-TTS-ANDROID
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PRO-TTS-debug-apk
          path: PRO-TTS-ANDROID/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
